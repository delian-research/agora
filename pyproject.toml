[project]
name = "agora"
version = "0.1.0"
description = "Market data ingestion and local Parquet store for Massive.com (formerly Polygon.io) data — bulk historical via S3 flat files, live REST + WebSocket access, security master with FIGI-linked ticker history."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "aklingler" }]
license = { text = "Proprietary" }
keywords = ["market-data", "polygon", "massive", "parquet", "quant", "ohlcv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "boto3>=1.42.97",
    "holidays>=0.94",
    "massive>=2.4.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pandas-market-calendars>=5.3.2",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "ipykernel>=7.2.0",
]

[project.scripts]
agora-download = "agora.download.cli:main"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
filterwarnings = [
    # Shims intentionally warn. Tests that exercise the shim assert the
    # warning explicitly via pytest.warns; other tests importing from the
    # canonical path shouldn't see the message.
    "ignore::DeprecationWarning:agora.loaders.s3",
    "ignore::DeprecationWarning:agora.adapters.market",
]

# ── Ruff ────────────────────────────────────────────────────────────
# High-signal lint bundle. Runs on agora/ and tests/.
#   E  — pycodestyle errors      F  — pyflakes (unused imports etc.)
#   I  — isort import ordering   B  — flake8-bugbear (real-bug patterns)
#   UP — pyupgrade (idiomatic modern Python)
[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Allow typical test-style ignores (e.g., long lines in fixtures).
per-file-ignores = { "tests/*" = ["E501"] }

# ── mypy ────────────────────────────────────────────────────────────
# Permissive baseline. The CI step targets a curated subset; this config
# governs what mypy does when invoked over those paths.
[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# Start permissive — tighten in follow-up PRs.
strict = false
check_untyped_defs = false
disallow_untyped_defs = false

# ── coverage ────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["agora"]
branch = true
omit = [
    "agora/models.py",         # empty placeholder
    "agora/loaders/s3.py",     # deprecation shim
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
